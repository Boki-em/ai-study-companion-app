<!DOCTYPE html>
<html>
<head>
    <title>AI Quiz</title>
</head>
<body>

<h2>Generated Quiz</h2>

<form>

{% for q in questions %}

    <input type="text" name="q{{ loop.index }}">

{% endfor %}

</form>

<a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</body>
</html>
